version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: donacionsangre_db
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: donacionsangre_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: sistema_donacion
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/donacionsangre_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      JWT_SECRET: cimm_adso_sena_blood_bank_secret_key_2024
      JWT_EXPIRATION: 86400000
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: